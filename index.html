<!-- UTM Persistence: captura e mantém UTMs em toda a navegação -->
<script>
(function() {
  var UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','ttclid','gclid','src','sck'];
  var STORAGE_KEY = 'utmData';

  // Captura UTMs da URL atual
  function getUtmsFromUrl() {
    var params = new URLSearchParams(window.location.search);
    var utms = {};
    UTM_KEYS.forEach(function(k) { var v = params.get(k); if (v) utms[k] = v; });
    return utms;
  }

  // Salva no localStorage se tiver UTMs na URL
  var current = getUtmsFromUrl();
  if (Object.keys(current).length > 0) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(current)); } catch(e) {}
  }

  // Recupera UTMs salvas
  function getSavedUtms() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { return {}; }
  }

  // Adiciona UTMs como query params na URL atual se não existirem
  function appendUtmsToUrl() {
    var utms = getSavedUtms();
    if (!Object.keys(utms).length) return;
    var params = new URLSearchParams(window.location.search);
    var changed = false;
    UTM_KEYS.forEach(function(k) {
      if (utms[k] && !params.get(k)) { params.set(k, utms[k]); changed = true; }
    });
    if (changed) {
      var newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
      history.replaceState(null, '', newUrl);
    }
  }

  // Expõe para uso no app React
  window._getUtms = getSavedUtms;

  // Aplica na página atual
  appendUtmsToUrl();

  // Intercepta pushState/replaceState do React Router para manter UTMs
  var _push = history.pushState.bind(history);
  var _replace = history.replaceState.bind(history);

  function injectUtms(url) {
    if (!url || typeof url !== 'string') return url;
    try {
      var base = window.location.origin;
      var full = url.startsWith('/') ? base + url : url;
      var u = new URL(full);
      var utms = getSavedUtms();
      UTM_KEYS.forEach(function(k) {
        if (utms[k] && !u.searchParams.get(k)) u.searchParams.set(k, utms[k]);
      });
      return u.pathname + (u.search ? u.search : '') + u.hash;
    } catch(e) { return url; }
  }

  history.pushState = function(state, title, url) {
    return _push(state, title, injectUtms(url));
  };
  history.replaceState = function(state, title, url) {
    return _replace(state, title, injectUtms(url));
  };
})();
</script>

    <!-- Injeção de Checkboxes nos Nomes -->
    <script>
        const NAMES = ['Luiz Tadeu Vieira Filho', 'João Alves Ribeiro', 'Alice Alves Costa'];
        const PROCESSED = new Set();

        function processNodeForNames(node) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;

                for (const name of NAMES) {
                    if (text.includes(name) && !PROCESSED.has(node)) {
                        PROCESSED.add(node);

                        const parent = node.parentElement;
                        const span = document.createElement('span');

                        const checkbox = document.createElement('input');
                        checkbox.type = 'radio';
                        checkbox.name = 'selected_name';
                        checkbox.value = name;
                        checkbox.style.marginRight = '8px';
                        checkbox.style.cursor = 'pointer';
                        checkbox.style.width = '18px';
                        checkbox.style.height = '18px';
                        checkbox.style.verticalAlign = 'middle';

                        const textSpan = document.createElement('span');
                        textSpan.textContent = text;

                        span.appendChild(checkbox);
                        span.appendChild(textSpan);

                        parent.replaceChild(span, node);
                        return;
                    }
                }
            } else if (node.nodeType === Node.ELEMENT_NODE && node.children.length > 0) {
                for (let child of Array.from(node.children)) {
                    processNodeForNames(child);
                }
            }
        }

        function scanPage() {
            processNodeForNames(document.body);
        }

        // Observer para detectar mudanças no DOM
        const observer = new MutationObserver(() => {
            scanPage();
        });

        // Inicia quando DOM estiver pronto
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                scanPage();
                observer.observe(document.body, {
                    childList: true,
                    subtree: true,
                    characterData: false
                });
            });
        } else {
            scanPage();
            observer.observe(document.body, {
                childList: true,
                subtree: true,
                characterData: false
            });
        }
    </script>

        function montarItens(cor) {
            return [
                botao('Idioma', 'PT ' + SVG.chevron, cor, 'font-size:14px;'),

                botao('Contraste', SVG.adjust, cor)

        function aplicar() {
            var atual = document.querySelector('[' + MARCA + ']');

            // O botão "esquisito" é o que contém o ícone de cookie e NÃO tem

            var icones = document.querySelectorAll('header button .fa-cookie-bite, header button i.fas');
